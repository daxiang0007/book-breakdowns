<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拆书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 设计计划 · 布局概念：一张书目卡片夹。每本书是一张可抽取的卡片，
   炉火色标"约束/冲突"类书，钢青标"流动/方法"类书，沿用拆书系列的二元色。
   字体角色：Fraunces 做展示数字与英文书名，Noto Serif SC 做中文标题，
   Noto Sans SC 做正文，JetBrains Mono 做编号与元数据。 */

:root {
  --paper: #e8ecef;
  --paper-2: #dde4e8;
  --card: #f5f7f8;
  --ink: #1b2a33;
  --muted: #5a6b75;
  --line: #c2ccd2;
  --furnace: #a83a28;
  --furnace-wash: rgba(168,58,40,0.09);
  --steel: #17677f;
  --steel-wash: rgba(23,103,127,0.09);
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121b20;
    --paper-2: #1a262c;
    --card: #1d2a30;
    --ink: #dfe8ec;
    --muted: #9cafb9;
    --line: #34464f;
    --furnace: #e8795f;
    --furnace-wash: rgba(232,121,95,0.13);
    --steel: #63b2cb;
    --steel-wash: rgba(99,178,203,0.13);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --paper: #121b20;
  --paper-2: #1a262c;
  --card: #1d2a30;
  --ink: #dfe8ec;
  --muted: #9cafb9;
  --line: #34464f;
  --furnace: #e8795f;
  --furnace-wash: rgba(232,121,95,0.13);
  --steel: #63b2cb;
  --steel-wash: rgba(99,178,203,0.13);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1080px; margin-inline: auto; }

h1, h2, h3 { font-family: var(--serif); text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-weight: 900; }
h2 { font-weight: 700; }
h3 { font-weight: 700; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }

:focus-visible { outline: 2px solid var(--steel); outline-offset: 3px; }

.theme-btn {
  position: fixed;
  top: max(16px, env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 10;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 7px 10px;
  cursor: pointer;
}

.masthead {
  margin-top: 24px;
  padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 56px);
  border: 1px solid var(--line);
  border-radius: 2px;
  background:
    radial-gradient(ellipse at 10% 0%, var(--furnace-wash), transparent 55%),
    radial-gradient(ellipse at 90% 100%, var(--steel-wash), transparent 60%),
    var(--card);
}
.masthead .kicker {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.masthead h1 { font-size: clamp(3rem, 11vw, 5.5rem); letter-spacing: 0.06em; margin-top: 28px; }
.masthead .subtitle { font-family: var(--display); font-style: italic; font-size: clamp(1rem, 2.4vw, 1.35rem); color: var(--steel); margin-top: 2px; }
.masthead .tagline { font-family: var(--serif); font-size: clamp(1.05rem, 2.4vw, 1.3rem); margin-top: 22px; max-width: 46ch; }

.shelf { padding-block: clamp(48px, 8vw, 80px); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 26px; }
.section-num { font-family: var(--display); font-style: italic; font-size: clamp(1.5rem, 3.6vw, 2rem); color: var(--furnace); line-height: 1; }
.section-head h2 { font-size: clamp(1.4rem, 3.6vw, 1.9rem); }
.section-head .count { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; color: var(--muted); margin-left: auto; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

.book-card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--card);
  padding: 22px 20px 20px;
  transition: transform 0.18s ease, border-color 0.18s ease;
}
.book-card:hover { border-color: var(--steel); transform: translateY(-3px); }
.book-card:focus-visible { border-color: var(--steel); }

.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.card-top .kind { color: var(--furnace); font-weight: 600; }
.card-top .kind.flow { color: var(--steel); }

.book-card h3 { font-size: 1.6rem; margin-top: 18px; }
.book-card .en { font-family: var(--display); font-style: italic; font-size: 0.92rem; color: var(--muted); margin-top: 3px; }
.book-card .desc { font-size: 0.88rem; color: var(--muted); margin-top: 14px; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 20px; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
.card-foot .go { color: var(--steel); font-weight: 600; }

.placeholder { border: 1px dashed var(--line); border-radius: 2px; padding: 22px 20px; color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.placeholder .big { font-family: var(--display); font-style: italic; font-size: 1.6rem; color: var(--line); }

footer { border-top: 1px solid var(--line); padding-block: 22px 40px; font-family: var(--mono); font-size: 0.68rem; line-height: 1.7; color: var(--muted); }

@media (max-width: 860px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .cards { grid-template-columns: minmax(0, 1fr); }
  .section-head .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .masthead > * { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both; }
  .masthead > :nth-child(2) { animation-delay: 0.08s; }
  .masthead > :nth-child(3) { animation-delay: 0.08s; }
  .masthead > :nth-child(4) { animation-delay: 0.16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<button class="theme-btn" id="themeToggle" type="button" aria-label="切换主题">主题 · 跟随系统</button>

<div class="wrap">

  <header class="masthead">
    <div class="kicker">拆书笔记 · 持续更新</div>
    <h1>拆书</h1>
    <p class="subtitle">Reading, taken apart.</p>
    <p class="tagline">每本书一个页面。留下能用来做判断的东西，其余的还给书。</p>
  </header>

  <section class="shelf" aria-labelledby="shelf-title">
    <div class="section-head">
      <span class="section-num tnum">01</span>
      <h2 id="shelf-title">书架</h2>
      <span class="count" id="bookCount">共 1 本</span>
    </div>

    <div class="cards">
      <a class="book-card" href="the-goal.html">
        <div class="card-top"><span class="tnum">NO. 01</span><span class="kind">约束 / 冲突</span></div>
        <h3>目标</h3>
        <div class="en">The Goal</div>
        <p class="desc">高德拉特用一家濒临关闭的工厂讲清楚一件事：系统的产出由最慢的那一环决定。有效产出、库存、运营费用，三个数重写计分板。</p>
        <div class="card-foot"><span>高德拉特 · 1984</span><span class="go">读这一页 →</span></div>
      </a>
    </div>
  </section>

  <footer>读书拆解系列 · 非官方内容，以原书为准。<br>主题可切换：跟随系统 / 浅色 / 深色。</footer>

</div>

<script>
(function () {
  var btn = document.getElementById("themeToggle");
  var modes = ["auto", "light", "dark"];
  var labels = { auto: "主题 · 跟随系统", light: "主题 · 浅色", dark: "主题 · 深色" };
  var stored = null;
  try { stored = localStorage.getItem("goal-theme"); } catch (e) {}
  var current = modes.indexOf(stored) >= 0 ? stored : "auto";

  function apply(mode) {
    if (mode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    btn.textContent = labels[mode];
  }
  apply(current);
  btn.addEventListener("click", function () {
    current = modes[(modes.indexOf(current) + 1) % modes.length];
    apply(current);
    try { localStorage.setItem("goal-theme", current); } catch (e) {}
  });

  // 书架计数从卡片数量读取，加书时不用改这里
  var n = document.querySelectorAll(".book-card").length;
  document.getElementById("bookCount").textContent = "共 " + n + " 本";
})();
</script>

</body>
</html>
